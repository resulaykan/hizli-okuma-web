<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#grad1)" filter="url(#shadow)" />

  <!-- Speed Focus Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="12 12" />
  
  <!-- Subtle Crosshairs -->
  <line x1="256" y1="64" x2="256" y2="110" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="402" x2="256" y2="448" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />

  <!-- Central Speed Lightning Bolt Icon -->
  <path d="M280 128 L176 280 L248 280 L232 384 L336 232 L264 232 Z" fill="url(#boltGrad)" />
</svg>
